name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      # The man page carries the version in its .TH line, which goes stale
      # the moment a tag is cut. Stamp the tag into the working copy before
      # goreleaser packages it — the repo itself is not churned per release.
      #
      # goreleaser refuses to build from a dirty tree, and rightly so, but
      # this edit is deliberate and confined to a file it only packages.
      # assume-unchanged tells git to stop reporting it, which is narrower
      # than skipping goreleaser's validation wholesale: any *other* file a
      # step manages to modify still fails the release.
      - name: Stamp the man page version
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i "1s|.*|.TH MDV 1 \"$(date -u +'%B %Y')\" \"mdv ${v}\" \"User Commands\"|" docs/mdv.1
          git update-index --assume-unchanged docs/mdv.1
          head -1 docs/mdv.1
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
