version: 2
project_name: mdv

builds:
  - main: ./cmd/mdv
    binary: mdv
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - docs/mdv.1
      - examples/*

checksum:
  name_template: checksums.txt

changelog:
  use: git
